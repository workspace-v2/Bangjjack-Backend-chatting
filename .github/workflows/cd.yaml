name: bangjjack CD 파이프라인

# 브랜치 = 배포 환경
#   main -> main 서버 (bangjjack-main-backend)
#   dev  -> dev  서버 (bangjjack-dev-backend)
# AWS 인증은 GitHub OIDC (장기 액세스 키 없음). 브랜치별 IAM 역할은 자기 환경 서버에만 배포 가능.
#
# 필요한 Repository variables (terraform/scripts/set-github-vars.sh 가 설정):
#   AWS_ROLE_ARN_MAIN, AWS_ROLE_ARN_DEV, AWS_REGION, ECR_REPOSITORY
on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.ref_name }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'bangjjack-backend' }}
  PROJECT_TAG: bangjjack

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

  deploy:
    needs: test
    # 인프라(terraform)와 저장소 변수 설정 전에는 배포 단계를 건너뜀
    if: >-
      (github.ref_name == 'main' && vars.AWS_ROLE_ARN_MAIN != '') ||
      (github.ref_name == 'dev' && vars.AWS_ROLE_ARN_DEV != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS IAM role

    # NOTE: GitHub "environment" 를 지정하면 OIDC sub 클레임이 environment:<name> 으로 바뀌어
    # IAM 신뢰 정책(ref:refs/heads/<branch>)과 맞지 않게 되므로 사용하지 않는다.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build bootJar
        run: chmod +x gradlew && ./gradlew bootJar

      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref_name == 'main' && vars.AWS_ROLE_ARN_MAIN || vars.AWS_ROLE_ARN_DEV }}
          role-session-name: gha-${{ github.ref_name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 ECR 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.DEPLOY_ENV }}
          cache-to: type=gha,mode=max,scope=${{ env.DEPLOY_ENV }}

      - name: ${{ github.ref_name }} 서버 배포 (SSM)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-${{ github.sha }}
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=${PROJECT_TAG}" \
                      "Name=tag:Env,Values=${DEPLOY_ENV}" \
                      "Name=tag:Role,Values=backend" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::${DEPLOY_ENV} backend instance not found"; exit 1
          fi
          echo "target instance: $INSTANCE_ID"

          PARAMS=$(jq -nc --arg c "/usr/local/bin/${PROJECT_TAG}-deploy ${IMAGE}" '{commands: [$c]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${DEPLOY_ENV} ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "ssm command: $COMMAND_ID"

          STATUS=Pending
          for _ in $(seq 1 100); do
            sleep 6
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          echo "::group::deploy output"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          echo "::endgroup::"
          ERR=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          [ -n "$ERR" ] && [ "$ERR" != "None" ] && { echo "::group::stderr"; echo "$ERR"; echo "::endgroup::"; }

          if [ "$STATUS" != "Success" ]; then
            echo "::error::deploy ${STATUS} (서버에서 이전 이미지로 롤백을 시도함)"; exit 1
          fi

          {
            echo "### ${DEPLOY_ENV} 배포 완료"
            echo "- image: \`${IMAGE}\`"
            echo "- instance: \`${INSTANCE_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
