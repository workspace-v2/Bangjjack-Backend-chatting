name: bangjjack CD 파이프라인

# 브랜치 = 배포 환경
#   main -> ECS 서비스 bangjjack-main-backend (클러스터 bangjjack)
#   dev  -> ECS 서비스 bangjjack-dev-backend
# 배포: 이미지 ECR 푸시 -> 현재 태스크 정의에 새 이미지를 넣어 리비전 등록 -> 서비스 롤링 배포.
#   새 태스크가 ALB 헬스 체크를 통과하지 못하면 ECS deployment circuit breaker 가 이전 리비전으로 롤백한다.
# AWS 인증은 GitHub OIDC (장기 액세스 키 없음). 브랜치별 IAM 역할은 자기 환경 서비스에만 배포 가능.
#
# 필요한 Repository variables (terraform/scripts/set-github-vars.sh 가 설정):
#   AWS_ROLE_ARN_MAIN, AWS_ROLE_ARN_DEV, AWS_REGION, ECR_REPOSITORY
on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.ref_name }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'bangjjack-backend' }}
  PROJECT_TAG: bangjjack
  ECS_CLUSTER: bangjjack
  ECS_SERVICE: bangjjack-${{ github.ref_name }}-backend
  TASK_FAMILY: bangjjack-${{ github.ref_name }}-backend
  CONTAINER_NAME: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

  deploy:
    needs: test
    # 인프라(terraform)와 저장소 변수 설정 전에는 배포 단계를 건너뜀
    if: >-
      (github.ref_name == 'main' && vars.AWS_ROLE_ARN_MAIN != '') ||
      (github.ref_name == 'dev' && vars.AWS_ROLE_ARN_DEV != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS IAM role

    # NOTE: GitHub "environment" 를 지정하면 OIDC sub 클레임이 environment:<name> 으로 바뀌어
    # IAM 신뢰 정책(ref:refs/heads/<branch>)과 맞지 않게 되므로 사용하지 않는다.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build bootJar
        run: chmod +x gradlew && ./gradlew bootJar

      - name: AWS 자격 증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref_name == 'main' && vars.AWS_ROLE_ARN_MAIN || vars.AWS_ROLE_ARN_DEV }}
          role-session-name: gha-${{ github.ref_name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 ECR 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ env.DEPLOY_ENV }}
          cache-to: type=gha,mode=max,scope=${{ env.DEPLOY_ENV }}

      - name: ${{ github.ref_name }} 태스크 정의 리비전 등록
        id: taskdef
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-${{ github.sha }}
        run: |
          set -euo pipefail

          # 패밀리의 최신 리비전을 기준으로 이미지 태그만 바꾼다. Terraform 이 바꾼 설정
          # (CPU/메모리, secrets, 포트, FIS 사이드카, 로그)은 최신 리비전에 있으므로 그대로 이어받는다.
          CURRENT=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition.taskDefinitionArn' --output text 2>/dev/null || true)
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "None" ]; then
            echo "::error::task definition ${TASK_FAMILY} not found (terraform apply 먼저)"; exit 1
          fi
          echo "base task definition: $CURRENT"

          aws ecs describe-task-definition --task-definition "$CURRENT" --query taskDefinition --output json \
            | jq --arg image "$IMAGE" --arg name "$CONTAINER_NAME" '
                .containerDefinitions |= map(if .name == $name then .image = $image else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)' > taskdef.json

          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered: $NEW_ARN"
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: ${{ github.ref_name }} ECS 롤링 배포
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_ENV }}-${{ github.sha }}
          NEW_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail

          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_ARN" --query 'service.deployments[0].id' --output text

          # PRIMARY 배포가 COMPLETED 가 될 때까지 대기. circuit breaker 롤백(FAILED)이면 실패 처리.
          STATE=IN_PROGRESS
          for _ in $(seq 1 80); do # 최대 약 20분
            sleep 15
            read -r STATE PRIMARY_TD RUNNING DESIRED < <(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].[rolloutState, taskDefinition, runningCount, desiredCount]' \
              --output text)
            echo "rollout=$STATE running=$RUNNING/$DESIRED taskdef=${PRIMARY_TD##*/}"
            if [ "$PRIMARY_TD" != "$NEW_ARN" ]; then
              STATE=ROLLED_BACK; break
            fi
            case "$STATE" in
              COMPLETED|FAILED) break ;;
            esac
          done

          if [ "$STATE" != "COMPLETED" ]; then
            echo "::group::service events"
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].events[:15].[createdAt, message]' --output text || true
            echo "::endgroup::"
            echo "::error::deploy ${STATE} (circuit breaker 가 이전 리비전으로 롤백했는지 서비스 이벤트를 확인)"
            exit 1
          fi

          {
            echo "### ${DEPLOY_ENV} 배포 완료"
            echo "- image: \`${IMAGE}\`"
            echo "- service: \`${ECS_CLUSTER}/${ECS_SERVICE}\`"
            echo "- task definition: \`${NEW_ARN##*/}\`"
          } >> "$GITHUB_STEP_SUMMARY"
