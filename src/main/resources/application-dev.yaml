spring:
  application:
    name: bangjjack
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD:}

server-uri: ${SERVER_URI}
front-uri: ${FRONT_URI}

jwt:
  access:
    secret: ${JWT_ACCESS}
    expiration-seconds: 259200

ai:
  match-api:
    base-url: ${AI_MATCH_API_BASE_URL}
    connect-timeout: 3000
    read-timeout: 5000
    read-timeout-batch: 10000
    recommended-top-k: 10
    recommended-roommates-top-k: 3
    recommended-roommates-cache-ttl: 21600
    recommended-roommates-chunk-size: 5

server:
  tomcat:
    mbeanregistry:
      enabled: true # tomcat_threads_* 메트릭

# actuator는 별도 포트(8081)로 분리: 외부(Caddy → 8080)에는 노출되지 않고
# 보안 그룹상 모니터링 서버만 접근 가능
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      maximum-expected-value:
        http.server.requests: 10s

dev:
  secret: ${DEV_SECRET}
