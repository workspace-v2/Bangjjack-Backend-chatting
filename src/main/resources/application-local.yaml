spring:
  application:
    name: bangjjack
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: none # 스키마는 Flyway 가 관리한다 (db/migration). 엔티티 변경 시 V{n}__*.sql 을 추가
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 DB(이미 테이블이 있는 main/dev)는 V1(baseline) 을 실행하지 않고 기준점으로만 기록한다
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/auth/login/google
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

server-uri: http://localhost:8080
front-uri: http://localhost:5173

jwt:
  access:
    secret: ${JWT_ACCESS}
    expiration-seconds: 259200

ai:
  match-api:
    base-url: ${AI_MATCH_API_BASE_URL}
    connect-timeout: 3000
    read-timeout: 5000
    read-timeout-batch: 10000
    recommended-top-k: 10
    recommended-roommates-top-k: 3
    recommended-roommates-cache-ttl: 21600
    recommended-roommates-chunk-size: 5

logging:
  level:
    com.project.bangjjack.global.config.websocket: DEBUG
    com.project.bangjjack.domain.chat: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.messaging.simp: DEBUG

dev:
  secret: ${DEV_SECRET:local-dev-secret}
