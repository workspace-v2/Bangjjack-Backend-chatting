# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 리뷰 설정 (https://docs.coderabbit.ai/reference/configuration)
language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  # 핵심 코드 리뷰와 요약은 유지하고 부가 생성·탐색 작업은 생략한다.
  sequence_diagrams: false
  changed_files_summary: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  tools:
    ast-grep:
      essential_rules: false      # 기본 AST 규칙은 생략하고 저장소 자체 규칙이 있을 때만 실행
  path_filters:
    - "!src/main/resources/db/migration/V1__baseline.sql"   # 운영 DB 덤프 기반 기준 스키마
    - "!.claude/**"                                         # 기능 명세 문서
    - "!build/**"
    - "!.gradle/**"
    - "!gradle/wrapper/gradle-wrapper.jar"                    # 생성된 바이너리
  path_instructions:
    - path: "src/main/java/**"
      instructions: >
        다중 서버(ECS 2태스크) + Redis Pub/Sub + MySQL 구조의 채팅 서비스다.
        동시성(같은 채팅방 동시 쓰기), 트랜잭션 경계(@Transactional, AFTER_COMMIT 이벤트),
        락 순서와 데드락 가능성, Redis/DB 장애 시 동작(예외 전파, 재시도, 유실·중복)을 중점적으로 리뷰한다.
    - path: "src/main/resources/db/migration/**"
      instructions: "운영 데이터가 있는 테이블에 대한 잠금 시간, 하위 호환(구 버전 코드와 공존), 롤백 가능성을 확인한다."
    - path: "src/test/**"
      instructions: "장애/경계 상황을 실제로 검증하는지, 검증 없이 통과하는 테스트가 없는지 확인한다."
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false                  # 작성 중인 PR은 준비 완료 후 리뷰
    base_branches:
      - "dev"
      - "main"
  poem: false
  in_progress_fortune: false

knowledge_base:
  web_search:
    enabled: true                  # 외부 최신 문서 검색은 유지
  learnings:
    scope: local                   # 이 저장소의 학습 내용만 사용
  issues:
    scope: local                   # 이 저장소의 이슈만 사용
  pull_requests:
    scope: local                   # 이 저장소의 PR 이력만 사용
